name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.4"
          extensions: curl, dom, json, mbstring, openssl, xml, xmlwriter
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate PHP
        run: composer check

      - name: Build deterministic fixtures
        run: |
          php bin/wordle doctor --mode=fixture
          php bin/wordle build-fixtures --mode=fixture

      - name: Validate frontend source
        run: npm run check:static

      - name: Build static output for browser validation
        run: |
          npm run build
          git diff --exit-code -- assets/dist
          php bin/wordle build --mode=fixture

      - name: Validate browser behavior
        run: npm run check:browser

      - name: Reconcile static output
        run: php bin/wordle reconcile --mode=fixture
